project: example_camera_case

# 部品は parts/ の部品ライブラリを use: で参照する。
# ここに書くのは「どう使うか」だけ。寸法・出典・信頼度はライブラリが持ち、
# プロジェクト側で上書きしようとすると load_bom() がエラーにする。

components:
  - use: raspberry_pi_zero_2w
    id: pi_zero
    clearance: 2.0
    retention: M2.6 タッピングネジ x4（ケース底のボスに直締め）
    note: micro USB は -Y 面から挿す。ケーブルの挿抜空間 15 mm を壁の外に確保する

  - use: pi_camera_v2
    id: camera
    clearance: 1.0
    retention: 台座に載せ、位置決めリブで横方向を拘束し、蓋で上から押さえる
    note: ネジ止めしない前提。レンズは天面の穴から上方を撮影する

  - use: lipo_603448
    id: battery
    clearance: 2.0
    retention: 床に両面テープで固定する
    note: 経年の膨らみを見込んでクリアランスを 2 mm 取っている

  - use: cable_micro_usb
    id: usb_cable
    clearance: 0.0
    geometric: false
    note: コネクタの挿抜空間は pi_zero の connectors で確保している

  - use: screw_m3x10_tapping
    id: screws_lid
    geometric: false
    note: 蓋固定に 4 本。ボスの下穴 φ2.4、ねじ込み深さ 7.5 mm

  - use: screw_m2_6x8_tapping
    id: screws_board
    geometric: false
    note: 基板固定に 4 本。ボスの下穴 φ2.1、ねじ込み深さ 6.4 mm

# 不要と判断したカテゴリは、その理由を残す。黙って飛ばさない。
excluded:
  actuator: 可動部を持たない
  display_ui: 表示・操作系はなし（電源は USB 抜き差しで代用）
  thermal: Pi Zero 2 W の発熱は小さく、通気口とヒートシンクは設けない
