project: stackchan

# M5Stack 版スタックチャンの外形シェル再現。内部部品は実寸モックで配置し、
# 外形は公式 STL の取り込みで再現する（model.py）。
# 部品は parts/ の部品ライブラリを use: で参照し、ここには使い方だけを書く。

components:
  - use: m5stack_cores3
    id: cores3
    clearance: 0.5
    retention: 前面フレームで保持し、周囲をシェルで拘束（画面が前面に出る）
    note: >
      顔として使う。画面・カメラ・マイク・IMU・スピーカー・ボタンはこのモジュールに
      内蔵されるため、本設計では 1 つの board として扱う。

  - use: feetech_scs0009
    id: servo_pan
    clearance: 1.0
    retention: 台座内にサーボブラケットで拘束し M2 タッピングで固定
    note: パン（水平回転）。取付穴・軸位置は台座の設計時に図面/実測で確定する

  - use: feetech_scs0009
    id: servo_tilt
    clearance: 1.0
    retention: 首フレームに M2 タッピングで固定
    note: チルト（首上下）。パンと同一部品で姿勢のみ異なる

  - use: lipo_550mah
    id: battery
    clearance: 1.5
    retention: 台座内のポケットに収め、両面テープまたは押さえで保持
    note: 台座内に寝かせて置く。寸法が暫定なのでポケットは実測後に確定する

  - use: cable_jst_1_25_4p
    id: servo_cable
    clearance: 0.0
    geometric: false
    retention: 台座内を通す（結束は不要）
    note: サーボ 2 個ぶんの配線。台座内の取り回し空間として確保する

  - use: screw_m2x6_tapping
    id: screws_servo
    geometric: false
    note: サーボの固定・ホーン締結用（仕様の M2 六角レンチに対応）

  - use: screw_m3x10_tapping
    id: screws_shell
    geometric: false
    note: 前後シェル・台座の組立用（仕様の M3 六角レンチに対応）

excluded:
  sensor: カメラ・IMU・マイクは CoreS3 に内蔵。単体部品としては配置しない（board に含む）
  display_ui: 画面・ボタン・LED は CoreS3 前面に内蔵。画面は cores3 の connector（screen 開口）で扱う
  thermal: 発熱は小さく、外形再現では通気口を設けない
