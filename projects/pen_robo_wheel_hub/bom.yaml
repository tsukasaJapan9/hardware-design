project: pen_robo_wheel_hub

# 変換ハブ単体の設計。相手部品（サーボ・ホイール）は干渉確認用に置くが、
# 印刷するのはハブ本体のみ。
# 部品は parts/ の部品ライブラリを use: で参照し、ここには使い方だけを書く。

components:
  - use: dynamixel_xl330
    id: xl330
    clearance: 1.0
    retention: ロボット脚側に固定（この部品では対象外、干渉確認用）
    note: 車輪サーボ（M077）として使う。ハブはこの出力ホーンに締結する

  - use: tamiya_narrow_tire_70145
    id: wheel
    clearance: 1.0
    retention: 変換ハブに 3x8mm タッピングビス3本で固定
    note: 駆動輪。ハブはウェブのポケットに収まり、外周で芯出しする

  - use: screw_m2x6_pan
    id: screws_horn
    geometric: false
    note: >
      ホーン固定に 4 本（XL330 付属品）。ハブ全高 7.5mm に対しネジが短いため、
      頭を座ぐり 4.5mm と深く沈めて先端をホーンまで届かせる
      （model.Params.cb_depth）。頭は上面より 3mm 下に収まりウェブに当たらない。
      ねじ込みは DP3.0 Max ちょうど。

  - use: tamiya_screw_3x8_tapping
    id: screws_wheel
    geometric: false
    note: >
      ホイール固定に 3 本（タミヤ 70145 付属品）。ハブ側は下穴 φ2.7 設計
      （刷り上がり φ2.5 目標）＋入口面取り。初回印刷で φ2.4 設計の穴が縮んで
      ビスが入らなかったため、縮み見込み 0.2 を足して見直した。

excluded:
  board: 電子基板は載らない
  sensor: センサなし
  power: 電源なし
  wiring: 配線は通らない
  display_ui: 表示・操作なし
  thermal: 発熱源なし
